version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: tp_final_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: tp_final_ids_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./tp_final_ids/backend/db.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  