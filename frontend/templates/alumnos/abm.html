{% extends "base.html" %}

{% block extra_head %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/alumnos.css') }}"
>
{% endblock %}

{% block content %}

<div class="abm-container">
    <div class="modal__content modal__content--wide">
        <h1 class="modal__title">
            Alumno
        </h1>

        <form
            method="POST"
            action="/alumnos/{{ alumno.id }}/editar"
        >
        
            <div class="form__row">
                <div class="form__group">
                    <label class="form__label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        value="{{ alumno.nombre }}"
                        class="form__input"
                    >
                </div>

                <div class="form__group">

                    <label class="form__label">
                        Apellido
                    </label>
                    <input
                        type="text"
                        name="apellido"
                        value="{{ alumno.apellido }}"
                        class="form__input"
                    >
                </div>
            </div>

            <div class="form__group">
                <label class="form__label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ alumno.email }}"
                    class="form__input"
                >

            </div>

            <div class="form__group">
                <label class="form__label">
                    Padrón
                </label>
                <input
                    type="text"
                    name="padron"
                    value="{{ alumno.padron }}"
                    class="form__input"
                >
            </div>

            <div class="form__group">
                <label class="form__label">
                    Estado
                </label>
                <select
                    name="abandono"
                    class="form__select"
                >
                    <option
                        value="false"
                        {% if not alumno.abandono %}selected{% endif %}
                    >
                        Activo
                    </option>
                    <option
                        value="true"
                        {% if alumno.abandono %}selected{% endif %}
                    >
                        Abandonó
                    </option>

                </select>

            </div>

            <div class="form__actions">
                <button
                    type="submit"
                    class="form__btn form__btn--submit"
                >
                    Guardar cambios
                </button>
            </div>
        </form>

        <form
            method="POST"
            action="/alumnos/{{ alumno.id }}/eliminar"
        >
            <button
                type="submit"
                class="form__btn btn-eliminar"
            >
                Eliminar alumno
            </button>
        </form>
    </div>

</div>

{% endblock %}
