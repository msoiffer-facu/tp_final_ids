{% extends "base.html" %}

{% block content %}
<div class="modal__content">
    <h1 class="modal__title">
        Importar CSV
    </h1>
    <form
        action="/importar" 
        method="POST" 
        enctype="multipart/form-data"
    >
        <input
            type="file"
            name="file"
            accept=".csv"
            class="form__input"
            required
        >
        <div class="form__actions">
            <button
                type="submit"
                class="form__btn form__btn--submit"
            >
                Importar
            </button>
        </div>
    </form>

    {% if errores %}
    <div class="alert alert-danger">
        <ul>
            {% for error in errores %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>
{% endblock %}
